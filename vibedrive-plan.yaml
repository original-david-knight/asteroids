project:
    name: asteroids-vector-museum
    objective: Build a faithful single-player 1979 Atari Asteroids clone in Rust that simulates a vector display (beam, phosphor, bloom) and synthesizes its audio in real time, run as a native Linux binary on the user's machine with no distribution surface.
    source_docs:
        - DESIGN.md
        - IDEA.md
        - PLAN.md
    constraint_files:
        - DESIGN.md
        - PLAN.md
tasks:
    - id: capability-probe
      title: Throwaway capability probe binary
      details: |
        Validate every assumption from DESIGN.md (Display & Timing Model, Audio Realtime Contract) and PLAN.md step 0 before committing to architecture.
        Build the probe in its own subdirectory (capability_probe/) as a standalone Cargo project so it stays throwaway and does not pollute the main crate.
        The probe must be a one-shot non-interactive binary: it opens the window, runs one display frame and one audio block to capture measurements, writes capability_probe/PROBE_NOTES.md, and exits with status 0 on success (or non-zero if a hard required assumption like Rgba16Float is missing). This is required so cargo run can be invoked from automation without hanging.
        Measurements to capture and record:
          - Monitor refresh rate and physical resolution (HiDPI scale).
          - wgpu surface formats with explicit Rgba16Float availability check and Rgba8Unorm fallback noted.
          - GPU time for a single 4K full-screen blit so the post-processing budget at 144Hz is measured rather than assumed (covers the reviewer concern about 4K @ 144Hz GPU budget).
          - cpal default output actual block size and sample rate (target 256 samples @ 48kHz) and which backend was selected (PipeWire vs ALSA - covers that reviewer concern).
          - SCHED_FIFO promotion via rtkit DBus result (acceptable degradation if unavailable, per DESIGN.md).
          - On Hyprland (Wayland), borderless fullscreen vsync/tearing behavior so the X11 fallback decision is made from real measurement (covers the Hyprland reviewer concern).
        Anything the probe finds wrong (e.g. PipeWire absent, Rgba16Float not advertised, vsync broken on the user's compositor) must be recorded so the next task can choose the right paths instead of guessing.
      status: done
      workflow: implement
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - capability_probe/ contains a standalone Cargo project that compiles and runs as a one-shot non-interactive binary that exits cleanly after capturing measurements.
        - 'Probe writes capability_probe/PROBE_NOTES.md containing: monitor refresh rate, supported surface formats with Rgba16Float verified or Rgba8Unorm fallback noted, 4K full-screen blit GPU time, cpal default block size + sample rate + backend (PipeWire vs ALSA), SCHED_FIFO outcome, and Hyprland borderless fullscreen vsync result.'
        - Reviewer concerns from PLAN.md about PipeWire vs ALSA selection, Hyprland Wayland fallback, and 4K @ 144Hz post-processing GPU budget each have an explicit measured answer in PROBE_NOTES.md.
        - Probe exit code reflects whether hard required assumptions (Rgba16Float availability, vsync behavior on the user's compositor) hold.
        - Manual verification (the user confirms the window appeared and the probe terminated) - call this out in notes since fullscreen window appearance is not automatable.
        - Record short notes capturing what was learned in this phase, including any measured value that should change architecture choices in the main crate if the project is re-planned and rerun in a fresh environment.
      verify_commands:
        - cargo build --manifest-path capability_probe/Cargo.toml
        - cargo run --manifest-path capability_probe/Cargo.toml
      commit_message: Add throwaway capability probe to validate display, GPU, and audio assumptions
    - id: project-skeleton
      title: Initialize main Rust crate with fullscreen window and audio module shape
      details: |
        Per PLAN.md step 1 and DESIGN.md premise 6, this task lays down the project skeleton with the audio module shape pre-built so step 8 is wiring, not design.
        Initialize the main crate at the repo root. The repo root already contains DESIGN.md, IDEA.md, PLAN.md, vibedrive.yaml, and vibedrive-plan.yaml. cargo init runs on non-empty directories without overwriting docs, so use `cargo init --name asteroids --vcs none --bin` (or equivalent) and verify the doc files are untouched.
        Add dependencies: wgpu, winit, cpal, fundsp, ringbuf, bytemuck, pollster. Pin to current stable releases compatible with Rust 1.90.
        Open a borderless fullscreen black window with vsync enabled per DESIGN.md Display & Timing Model (no exclusive fullscreen - modern monitors do not need it for tearing avoidance with vsync). Render at native physical resolution; respect HiDPI scale; explicitly no supersampling for v1 (DESIGN.md Display & Timing Model).
        Use the display server choice informed by capability_probe/PROBE_NOTES.md: X11 first; if Hyprland Wayland borderless fullscreen behaves correctly per the probe, no fallback needed. Esc closes the window and the process exits cleanly.
        Carve out the audio module shape now even though it is not wired (DESIGN.md premise 6 - architecture from day 0, wiring at step 8):
          - Define an AudioMsg enum matching DESIGN.md Audio Realtime Contract: SetParam(VoiceId, ParamId, f32), Trigger(VoiceId), Release(VoiceId), GameState(GameSnapshot).
          - Define VoiceId, ParamId, and a GameSnapshot POD (asteroid count, alive flag, score).
          - Stand up a lockfree ringbuffer (ringbuf crate) of capacity 1024 messages from the game thread to the audio side, with try-push that drops oldest non-critical SetParam messages but preserves Trigger/Release.
          - Sketch a Voice trait or struct family that pre-allocates DSP nodes once at app startup and exposes parameter mutation through AtomicF32 cells (no allocation in the audio callback).
          - Leave a placeholder cpal stream creation behind a feature flag or function that the audio-scaffolding task wires for real.
        Constraint reminder: the project is single-player only; no alternating 2-player even for v2 per DESIGN.md Constraints. Do not introduce 2-player abstractions.
      status: done
      workflow: implement
      deps:
        - capability-probe
      context_files:
        - DESIGN.md
        - PLAN.md
        - capability_probe/PROBE_NOTES.md
      acceptance:
        - Cargo.toml lists wgpu, winit, cpal, fundsp, ringbuf, bytemuck, and pollster with versions compatible with Rust 1.90 stable.
        - DESIGN.md, IDEA.md, PLAN.md, vibedrive.yaml, vibedrive-plan.yaml, and capability_probe/ are all preserved unchanged after cargo init.
        - 'Manual verification: cargo run opens a borderless fullscreen black window at native physical resolution with vsync on (no exclusive fullscreen), and Esc exits cleanly with status 0. Note the verification was done because window appearance is not automatable.'
        - 'The audio module exists with: AudioMsg enum (SetParam/Trigger/Release/GameState), VoiceId, ParamId, GameSnapshot POD, a lockfree ringbuf channel of capacity 1024 with the documented drop-oldest-SetParam policy, and a Voice abstraction that pre-allocates DSP nodes and uses AtomicF32 for parameter mutation.'
        - cpal is added as a dependency but no audio thread is spawned yet; the spawn entry point is gated until the audio-scaffolding task wires it.
        - Display-server choice (X11 vs Wayland borderless) reflects the probe finding from PROBE_NOTES.md.
        - Single-player constraint is preserved (no 2-player abstractions introduced).
        - Record short notes capturing what was learned in this phase, including dependency version pins, Wayland/X11 result, and any platform quirks that would matter if the project is re-planned and rerun in a fresh environment.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
      commit_message: Initialize asteroids crate with fullscreen window and audio module shape
    - id: hello-triangle
      title: Render a hello triangle through the wgpu pipeline
      details: |
        Per PLAN.md step 2, prove the wgpu render pipeline end-to-end with a throwaway triangle.
        Create a render pipeline with a vertex/fragment shader pair, a vertex buffer, and a single draw call into the swap-chain.
        Keep the triangle behind a debug feature flag or simply remove it once the next step starts replacing it with real beam-emission rendering.
      status: done
      workflow: implement
      deps:
        - project-skeleton
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - The triangle pipeline uses the same swap-chain format selected for the main app (informed by the probe and project-skeleton).
        - Code is structured so the triangle can be deleted in the beam-emit-api task without leaving cruft.
        - 'Manual verification: cargo run shows a clearly visible triangle on the black background. Note this is manual because the rendered output is not automatable from the verify gate.'
        - Record short notes capturing what was learned in this phase, including wgpu pipeline gotchas (bind groups, vertex layout, surface format selection) that matter for future render passes.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
      commit_message: Render hello triangle through the wgpu render pipeline
    - id: beam-emit-api
      title: Beam-emission API and per-frame line segment vertex buffer
      details: |
        Per PLAN.md step 3 and DESIGN.md Beam Rasterizer Spec, define the beam-draw command type and the per-frame upload path.
        Define BeamCommand with fields start (Vec2), end (Vec2), intensity (f32, normalized 0..1), and dwell_us (f32). Document that dwell_us is set per-segment by the emitter (no virtual beam-rate model in v1).
        Implement default dwell rules as named constants in one tunable module: ship outline segment 30us, asteroid hull segment 25us, bullet dot 40us, endpoint dwell bonus ~10us.
        Each frame: collect a Vec<BeamCommand>, expand each command into a small quad (two triangles) bounding the segment, and upload to a wgpu vertex buffer (re-used across frames; resize as needed).
        Replace the hello triangle pipeline with this beam-line pipeline. At this step the fragment shader can be a simple solid-white pass; the next task introduces the analytic line SDF and dwell coupling.
        Add a minimal unit test for the quad-expansion math (perpendicular vector direction, half-width offset) so the geometry is locked in before adding shader complexity on top.
      status: done
      workflow: implement
      deps:
        - hello-triangle
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - 'Rust types: BeamCommand and a builder/emitter API exist with the documented fields and per-segment dwell.'
        - Default dwell constants for ship segments (30us), asteroid hull (25us), bullet dot (40us), endpoint bonus (~10us) are named constants in one tunable module.
        - Per-frame Vec<BeamCommand> is uploaded into a wgpu vertex buffer of expanded quads and rendered with a placeholder white-line pass, replacing the hello triangle.
        - Unit test for quad-expansion math passes (perpendicular direction and half-width offset are correct for axis-aligned and diagonal segments).
        - 'Manual verification: cargo run shows a handful of test beam commands (e.g. an X across the screen) drawn as white lines.'
        - Record short notes capturing what was learned in this phase, including buffer resize strategy and any decisions about quad-expansion math.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
      commit_message: Add BeamCommand emission API and per-frame line segment vertex buffer
    - id: phosphor-accumulator
      title: Phosphor accumulator with Rgba16Float ping-pong textures
      details: |
        Per PLAN.md step 4 and DESIGN.md Beam Rasterizer Spec, implement the magic-milestone phosphor accumulator.
        Create two Rgba16Float textures matching the native render resolution and ping-pong them per frame. No supersampling for v1 (DESIGN.md Display & Timing Model).
        Render-pass order each frame:
          1. Draw current beam commands into the target phosphor texture using the analytic line SDF in the fragment shader.
             - 'Per-pixel brightness: intensity * dwell_factor * exp(-distance^2 / sigma^2), where sigma is the beam-spot radius (~1.0 physical pixel) and slow beam (high dwell) increases sigma slightly to bloom the spot when stationary.'
          2. Blend with the previous frame's phosphor texture using exponential decay: out = clamp(in_beam + in_previous * exp(-frame_dt / tau), 0, MAX_LUMA), with MAX_LUMA = 8.0 (HDR-like headroom).
          3. Tone-map at composite using Reinhard x / (x + 1) followed by gamma 2.2 before writing to the swap chain.
        Default tau = 70ms. Expose tau as a debug F-key slider so it can be tuned with the renderer running (also covers DESIGN.md Open Question 3 about persistence-of-vision target).
        With hard white lines and beam-driven dwell coupling, the trail effect must be visible at this step.
        If Rgba16Float was not supported per the probe, fall back to Rgba8Unorm with reduced MAX_LUMA and document the loss in notes.
      status: done
      workflow: implement
      deps:
        - beam-emit-api
      context_files:
        - DESIGN.md
        - PLAN.md
        - capability_probe/PROBE_NOTES.md
      acceptance:
        - Two Rgba16Float ping-pong textures (or Rgba8Unorm fallback if probe required it) are allocated at native render resolution and bound correctly in the per-frame render graph.
        - Fragment shader implements the analytic line SDF with the documented brightness formula and dwell-coupled sigma growth.
        - Phosphor blend pass implements exponential decay with MAX_LUMA = 8.0 and tau default 70ms.
        - Composite pass applies Reinhard tone-map and gamma 2.2 to the swap-chain output.
        - A debug F-key slider lets tau be changed live in the 50-100ms range without recompiling.
        - 'Manual verification: cargo run with moving test beam commands produces a visible phosphor trail (the magic-milestone effect).'
        - Record short notes capturing what was learned in this phase, including any wgpu binding-group surprises, sigma tuning notes, and any fallback to Rgba8Unorm if it was needed.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
      commit_message: Add phosphor accumulator with Rgba16Float ping-pong textures
    - id: instrumentation-harness
      title: Instrumentation harness for autonomous agent verification
      details: |
        The plan runs end-to-end by autonomous agents with no human-in-the-loop verification, so every downstream acceptance criterion must be checkable by an agent. This task installs the instrumentation primitives the rest of the plan relies on - without this, all subsequent checkpoints stall.
        Add the following CLI flags / runtime modes to the asteroids binary (extending project-skeleton, not a separate crate). Flags compose with each other. Running cargo run with no flags still launches the normal interactive fullscreen game.
          - --headless skips swap-chain present and renders to an offscreen target. Required for verification on hosts without an active display.
          - --screenshot <path> captures the final swap-chain image to PNG at <path>, then exits 0.
          - --capture-frames <N> --frames-out <dir> renders N consecutive frames, writes each to <dir>/frame_<idx>.png, exits 0. Used for trail/decay timelines.
          - --audio-capture <secs> --wav-out <path> routes the cpal output stream into a WAV writer for <secs> seconds (in addition to speakers), then exits 0. Used after audio-scaffolding lands; until then it captures whatever the graph produces (silence is fine).
          - --seed <u64> seeds every RNG in the simulation (asteroid spawn, hyperspace dice, attract mode, etc.) so screenshots and gameplay traces are deterministic.
          - --fixed-dt <secs> replaces the real-time clock with a fixed-delta-per-frame clock so screenshot timelines are reproducible regardless of host load.
          - --simulate-secs <S> runs the simulation for S simulated seconds (governed by --fixed-dt) without writing frames, then exits. Used for long-form gameplay scenarios where capturing every frame would be wasteful.
          - --scenario <name> runs a named scripted input/world sequence instead of reading the keyboard. Initial scenarios shipped here are idle, horizontal-sweep, static-bright-line, and gamma-ramp. Downstream tasks add their own scenarios (ship-spinning, thrust-1s, asteroids-round-1, bullet-hit-asteroid, etc.) as their verification requires.
          - --xrun-log <path> has the audio thread append any underrun/overrun events to <path> so verification can read them after the run.
          - --frame-time-log <path> has the render thread append per-frame durations to <path>.
          - --state-log <path> has the game thread append a one-line-per-tick JSON event log (input events, collisions, life changes, score changes, mode changes, RNG-driven outcomes) to <path>. Used by gameplay verification subcommands.
        Build a verification module and binary alongside the main app.
          - Rust module asteroids verify with helpers - load_png, line_luminance, decay_fit, peak_count, load_wav, rms, dominant_freq, spectral_band_energy, frame_time_p99, xrun_count, plus state-trace parsing.
          - Binary verify (add a [[bin]] entry; cargo run --bin verify -- <subcommand>) that wraps each helper as a CLI subcommand and exits 0 when the check passes, non-zero otherwise. Subcommands needed by downstream tasks include decay-fit, line-glow-width, line-peak-luminance, gamma-ramp, banding, peak-count, ship-outline, soul-visible, asteroid-count, screen-wrap, lives-display, playfield-rect, audio-rms, audio-dominant-freq, audio-band-energy, heartbeat-tempo, xrun-count, frame-time-p99, state-trace.
          - Each subcommand documents required arguments via --help and reports failure measurements on stderr so the agent can record them in notes when a gate fails.
        Constraint - instrumentation must not allocate inside the audio callback (DESIGN.md Audio Realtime Contract). The WAV capture path buffers samples through a lockfree queue; the actual file write happens on a background thread.
      status: done
      workflow: implement
      deps:
        - phosphor-accumulator
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - Asteroids binary supports the documented flags - --headless, --screenshot, --capture-frames/--frames-out, --audio-capture/--wav-out, --seed, --fixed-dt, --simulate-secs, --scenario, --xrun-log, --frame-time-log, --state-log. Running cargo run with no flags still opens the interactive fullscreen game.
        - 'Verification: cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario idle --screenshot /tmp/idle.png exits 0 and produces a non-empty PNG at the native render resolution.'
        - 'Verification: cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario horizontal-sweep --capture-frames 30 --frames-out /tmp/frames --xrun-log /tmp/xruns.log --frame-time-log /tmp/frametimes.log exits 0 and writes 30 sequential frame_*.png files plus the two log files (xrun log may be empty).'
        - asteroids verify module exposes load_png, line_luminance, decay_fit, peak_count, load_wav, rms, dominant_freq, spectral_band_energy, frame_time_p99, xrun_count, and state-trace helpers, with unit tests on synthetic inputs (e.g. decay_fit on a generated exp(-t/0.07) trace recovers tau within 5% and r_squared >= 0.99).
        - 'Verification: cargo run --bin verify -- decay-fit --help and the other documented subcommands all exit 0 and print usage text.'
        - The --audio-capture flag is wired but may produce a silent WAV until audio-scaffolding lands; the file must still be a valid 48kHz WAV that load_wav accepts.
        - No allocations occur in the audio callback under capture (verify by code review and reuse of the existing ringbuf pattern).
        - Record short notes capturing what was learned in this phase, including any platform quirks around offscreen rendering, the WAV format chosen, and which scenarios were stubbed for later tasks.
      verify_commands:
        - cargo build --release
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
        - cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario idle --screenshot /tmp/idle.png
        - cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario horizontal-sweep --capture-frames 30 --frames-out /tmp/frames --xrun-log /tmp/xruns.log --frame-time-log /tmp/frametimes.log
      commit_message: Add instrumentation harness for autonomous agent verification
    - id: checkpoint-phosphor-trail
      title: Checkpoint - phosphor trail decay verified numerically
      details: |
        Numeric verification gate before adding bloom on top of phosphor. Replaces the prior subjective "sit and look at it" gate so it can be checked by an autonomous agent.
        Use the instrumentation harness scenario horizontal-sweep (a single bright beam segment moving across the screen at a known speed) with --seed 1 --fixed-dt 0.00694 --capture-frames 60. For pixels along the trailing path behind the beam head, fit exp(-t/tau) to the per-pixel luminance timeline using verify decay-fit. Tau must land in [50ms, 100ms] with r_squared >= 0.95.
        Verify dwell coupling separately - capture two stills of static high-dwell vs low-dwell lines (extend --scenario static-bright-line with --dwell-us flag, or add scenarios static-bright-line-low-dwell at 10us and static-bright-line-high-dwell at 60us) and confirm peak-luminance and full-width-half-max ratios match the dwell-coupling model.
        If any check fails (curve is not exponential, tau outside range, peak luminance clipping at MAX_LUMA, dwell coupling missing), do not press on - reopen phosphor-accumulator with the failure measurement recorded in notes and the explicit loop-back target named.
      status: done
      workflow: checkpoint
      deps:
        - phosphor-accumulator
        - instrumentation-harness
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - 'Verification: cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario horizontal-sweep --capture-frames 60 --frames-out /tmp/phosphor produces frames whose decay fits exp(-t/tau) with tau in [50ms, 100ms] and r_squared >= 0.95, confirmed by cargo run --bin verify -- decay-fit --frames /tmp/phosphor --tau-min 0.05 --tau-max 0.10 --r2-min 0.95 exiting 0.'
        - 'Verification: peak luminance along the beam head is below MAX_LUMA (8.0) and above 1.0, confirmed by cargo run --bin verify -- line-peak-luminance --frame /tmp/phosphor/frame_00.png --min 1.0 --max 8.0 exiting 0.'
        - 'Verification: dwell sweep - cargo run --release -- --headless --seed 1 --scenario static-bright-line-low-dwell --screenshot /tmp/dwell-lo.png and --scenario static-bright-line-high-dwell --screenshot /tmp/dwell-hi.png followed by cargo run --bin verify -- line-glow-width --lo /tmp/dwell-lo.png --hi /tmp/dwell-hi.png --fwhm-ratio-min 1.2 exits 0.'
        - tau default constant in code is recorded as the value chosen from the measured fit (must be inside the [50ms, 100ms] window).
        - If any verification check fails, the failure measurement is recorded in notes and phosphor-accumulator is the explicit loop-back target - downstream tasks do not start.
        - Record short notes capturing what was learned in this phase, including the measured tau, sigma values, dwell-coupling observations, and any deviations from the model.
      verify_commands:
        - cargo build --release
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
        - cargo run --release -- --headless --seed 1 --fixed-dt 0.00694 --scenario horizontal-sweep --capture-frames 60 --frames-out /tmp/phosphor
        - cargo run --bin verify -- decay-fit --frames /tmp/phosphor --tau-min 0.05 --tau-max 0.10 --r2-min 0.95
        - cargo run --bin verify -- line-peak-luminance --frame /tmp/phosphor/frame_00.png --min 1.0 --max 8.0
        - cargo run --release -- --headless --seed 1 --scenario static-bright-line-low-dwell --screenshot /tmp/dwell-lo.png
        - cargo run --release -- --headless --seed 1 --scenario static-bright-line-high-dwell --screenshot /tmp/dwell-hi.png
        - cargo run --bin verify -- line-glow-width --lo /tmp/dwell-lo.png --hi /tmp/dwell-hi.png --fwhm-ratio-min 1.2
      commit_message: Checkpoint phosphor trail magic milestone
    - id: bloom-pass
      title: Bloom pass via Gaussian downsample-upsample chain
      details: |
        Per PLAN.md step 5, add a bloom pass on top of the phosphor texture so the lines start to glow.
        Implement a Gaussian downsample chain (e.g. 4 mip levels via successive blits) followed by an upsample chain that accumulates back, written in WGSL.
        Add the bloom output to the phosphor output before the composite tone-map step.
        Expose bloom intensity and threshold as debug-tunable values (so the polish-pass step can dial them in).
        Bloom strength must be subtle enough that vector lines still read as lines, not as smeared blobs - tune by feel and record the default values chosen.
      status: done
      workflow: implement
      deps:
        - checkpoint-phosphor-trail
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - WGSL shaders implement the Gaussian downsample and upsample passes with at least 3-4 mip levels.
        - Bloom output is added to the phosphor texture in the render graph, ahead of the tone-map.
        - Bloom intensity and threshold are tunable via the documented constants and via runtime --bloom-intensity / --bloom-threshold flags so verification can A/B them.
        - 'Verification: cargo run --release -- --headless --seed 1 --scenario static-bright-line --bloom-intensity 0 --screenshot /tmp/bloom-off.png and the same command with --bloom-intensity at the chosen default --screenshot /tmp/bloom-on.png followed by cargo run --bin verify -- line-glow-width --lo /tmp/bloom-off.png --hi /tmp/bloom-on.png --fwhm-ratio-min 2.0 --core-peak-tolerance 0.05 exits 0, confirming bloom widens the glow but preserves the line core peak luminance.'
        - 'Verification: cargo run --bin verify -- banding --frame /tmp/bloom-on.png --max-step-jump 0.05 exits 0, confirming bloom transition is gradual (no hard edges).'
        - Record short notes capturing what was learned in this phase, including default bloom intensity/threshold values and any Open Question 5 (CRT curvature) signal you noticed at this point.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
        - cargo run --release -- --headless --seed 1 --scenario static-bright-line --bloom-intensity 0 --screenshot /tmp/bloom-off.png
        - cargo run --release -- --headless --seed 1 --scenario static-bright-line --screenshot /tmp/bloom-on.png
        - cargo run --bin verify -- line-glow-width --lo /tmp/bloom-off.png --hi /tmp/bloom-on.png --fwhm-ratio-min 2.0 --core-peak-tolerance 0.05
        - cargo run --bin verify -- banding --frame /tmp/bloom-on.png --max-step-jump 0.05
      commit_message: Add Gaussian downsample-upsample bloom pass
    - id: aspect-ratio-decision
      title: Aspect-ratio strategy decision and implementation
      details: |
        DESIGN.md Open Question 1 and PLAN.md step 5. For the autonomous run the choice is locked to DESIGN.md's default lean (option c) - keep gameplay 4:3 in the center, fill the side margins with vector-art bezels showing score and lives readouts only (no cabinet art). Locking the decision avoids a taste call no agent can make and matches the recorded design preference; the alternatives below are recorded for traceability only.
        Alternatives considered and rejected:
          - (a) Letterbox the original 4:3 playfield with black bars on the sides.
          - (b) Stretch the playfield to widescreen (more space, asteroids spread out, slightly easier game).
        Implement option (c) in the renderer - define a playfield rectangle centered on the native render target with the original 4:3 aspect ratio, build bezel beam commands for the score and lives readouts in the side margins (stubs until scoring-and-lives lands), and route all subsequent gameplay beam commands through the playfield mapping.
      status: done
      workflow: implement
      deps:
        - bloom-pass
      context_files:
        - DESIGN.md
        - PLAN.md
      acceptance:
        - Option (c) - 4:3 playfield centered with vector-art bezel margins - is implemented as the locked aspect-ratio strategy, with the rationale (DESIGN.md default lean, autonomous run avoids taste call) recorded in code comments.
        - Renderer maps gameplay coordinates into the centered 4:3 playfield rectangle with non-zero bezel margins on both sides at any widescreen native resolution.
        - Vector-art bezels for score and lives readouts are stubbed in; subsequent beam emitters (ship, asteroids, bullets, UFO) use the playfield-space coordinate transform installed here.
        - 'Verification: cargo run --release -- --headless --seed 1 --scenario idle --screenshot /tmp/playfield.png followed by cargo run --bin verify -- playfield-rect --frame /tmp/playfield.png --aspect 4:3 --centered --bezel-min-fraction 0.05 exits 0, confirming the 4:3 playfield rect is centered and bezel margins are non-zero on both sides.'
        - Record short notes capturing what was learned in this phase, including any margin/bezel tuning notes and the bezel readout layout chosen.
      verify_commands:
        - cargo build
        - cargo clippy --all-targets -- -D warnings
        - cargo test --quiet
        - cargo run --release -- --headless --seed 1 --scenario idle --screenshot /tmp/playfield.png
        - cargo run --bin verify -- playfield-rect --frame /tmp/playfield.png --aspect 4:3 --centered --bezel-min-fraction 0.05
      commit_message: Implement 4:3 centered playfield with vector-art bezel margins
    - id: spinning-ship
      title: One spinning ship - soul-visible milestone
      details: |
        Per PLAN.md step 6, this is the soul-visible milestone. Stop here and look at it before adding gameplay.
        Define the original Asteroids 4-vertex (open triangular) ship outline and emit beam commands per frame to draw it.
