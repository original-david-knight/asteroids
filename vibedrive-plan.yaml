    - id: audio-scaffolding
      title: Wire cpal output stream to the fundsp DSP graph
      details: |
        Per PLAN.md step 8 and DESIGN.md Audio Realtime Contract, wire cpal to the existing audio module shape created in project-skeleton. This is wiring, not designing.
        Open the cpal default output stream (request 256 samples @ 48kHz; accept whatever the backend gives). Prefer PipeWire on modern Linux per the probe; fall back to ALSA direct.
        Spawn the audio thread, attempt SCHED_FIFO via rtkit (DBus) at startup, log on failure and continue with default priority (acceptable for a personal-use binary; xruns will be visible).
        Drain AudioMsg messages from the lockfree ringbuf at the start of each callback, applying SetParam writes to AtomicF32 cells; do not allocate in the callback.
        Build the fundsp DSP graph once at startup with all voice nodes pre-allocated and run them block-size-agnostic against whatever buffer length cpal supplies.
        At this step a silent (0.0 sample) graph is acceptable - the next task brings the first audible voice. Verify zero xruns under idle on the user's machine.
        Constraint reminder: synthesis only, no sample WAVs (DESIGN.md Constraints). The cpal stream feeds samples computed by fundsp, never decoded from disk.
        Input-latency target: the audio block is ~5.3ms @ 256/48kHz, contributing to the DESIGN.md "low input latency" constraint. Do not increase the block size beyond what the backend chooses.
      status: todo
      workflow: implement
      deps:
        - final-composite
      context_files:
        - DESIGN.md
        - PLAN.md
        - capability_probe/PROBE_NOTES.md
      acceptance:
        - cpal output stream opens at 48kHz with block size 256 (or whatever backend reports), confirmed at startup log.
        - Audio thread attempts SCHED_FIFO via rtkit and logs the outcome; success is preferred but failure is acceptable degradation per DESIGN.md.
        - The audio callback drains the ringbuf, applies SetParam writes through AtomicF32 cells, and emits samples through the fundsp graph with zero allocations in the callback.
        - Voice graph is built once at app startup; parameter mutation goes through Var/shared (AtomicF32) cells per DESIGN.md Audio Realtime Contract.
