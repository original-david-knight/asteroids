[package]
name = "asteroids"
version = "0.1.0"
edition = "2024"
default-run = "asteroids"

[features]
default = []
audio-scaffolding = []

[dependencies]
bytemuck = { version = "=1.25.0", features = ["derive"] }
cpal = "=0.17.3"
fundsp = "=0.23.0"
pollster = "=0.4.0"
png = "=0.18.1"
ringbuf = "=0.4.8"
serde_json = "=1.0.149"
wgpu = "=29.0.1"
winit = "=0.30.13"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"
