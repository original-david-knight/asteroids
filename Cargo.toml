[package]
name = "asteroids"
version = "0.1.0"
edition = "2024"
default-run = "asteroids"

[features]
default = []
audio-scaffolding = []

[dependencies]
bytemuck = { version = "=1.25.0", features = ["derive"] }
cpal = "=0.17.3"
fundsp = "=0.23.0"
libc = "=0.2.186"
pollster = "=0.4.0"
png = "=0.18.1"
ringbuf = "=0.4.8"
serde_json = "=1.0.149"
wgpu = "=29.0.1"
winit = "=0.30.13"
zbus = "=4.4.0"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[profile.dev.package.asteroids]
opt-level = 1

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2
